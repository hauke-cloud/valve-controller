replicaCount: 1

image:
  repository: ghcr.io/hauke-cloud/iot/valve-controller
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# REST API mTLS server
api:
  port: 8443
  logLevel: info

# cert-manager Certificate for the REST API server
tls:
  # cert-manager issuer reference for the server certificate
  issuerRef:
    name: cluster-issuer          # name of the ClusterIssuer or Issuer
    kind: ClusterIssuer
  # Secret containing the CA certificate used to verify client certs.
  # Must have a key named "ca.crt".
  clientCASecretName: valve-controller-client-ca
  # DNS names for the server certificate
  dnsNames:
    - valve-controller
    - valve-controller.mqtt.svc.cluster.local

service:
  type: ClusterIP
  port: 8443

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /api/v1/healthz
    port: probe
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /api/v1/readyz
    port: probe
  initialDelaySeconds: 5
  periodSeconds: 15
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus Operator integration
prometheus:
  serviceMonitor:
    enabled: true
    namespace: ""  # defaults to Release.Namespace
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  rules:
    enabled: true
    namespace: ""  # defaults to Release.Namespace
    labels: {}
    # Additional alert rule severity label
    additionalLabels: {}

# Install the MQTTValve CRD via the chart.
# Disable if you manage CRDs separately.
installCRD: true
