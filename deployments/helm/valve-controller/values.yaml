replicaCount: 1

logLevel: info

image:
  repository: ghcr.io/hauke-cloud/valve-controller
  pullPolicy: IfNotPresent
  tag: "" # defaults to .Chart.AppVersion

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# REST API mTLS server
api:
  port: 8443

# TLS configuration for the REST API mTLS server.
tls:
  # Name of an existing Secret containing tls.crt and tls.key.
  # When set, the chart uses this secret directly and does not create a Certificate.
  existingSecret: ""
  # Secret containing the CA certificate used to verify client certs.
  # Must have a key named "ca.crt".
  clientCASecretName: valve-controller-client-ca
  # DNS names included in the server certificate (used by cert-manager).
  dnsNames:
    - valve-controller
    - valve-controller.mqtt.svc.cluster.local

# cert-manager integration — creates a Certificate resource for the API server.
# Set enabled: true and provide an issuerRef when cert-manager is available.
# When disabled, supply tls.existingSecret with a pre-provisioned Secret.
certManager:
  enabled: false
  issuerRef:
    name: cluster-issuer
    kind: ClusterIssuer

service:
  type: ClusterIP
  port: 8443

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: probe
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: probe
  initialDelaySeconds: 5
  periodSeconds: 15
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus Operator integration
prometheus:
  serviceMonitor:
    enabled: true
    namespace: "" # defaults to Release.Namespace
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  rules:
    enabled: true
    namespace: "" # defaults to Release.Namespace
    labels: {}
    # Additional alert rule severity label
    additionalLabels: {}

# Install the MQTTValve CRD via the chart.
# Disable if you manage CRDs separately.
installCRD: true
