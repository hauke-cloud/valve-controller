{{- if .Values.tls.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "valve-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valve-controller.labels" . | nindent 4 }}
spec:
  secretName: {{ include "valve-controller.tlsSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind | default "ClusterIssuer" }}
  dnsNames:
    {{- toYaml .Values.tls.dnsNames | nindent 4 }}
  usages:
    - server auth
  duration: 8760h   # 1 year
  renewBefore: 720h # renew 30 days before expiry
{{- end }}
